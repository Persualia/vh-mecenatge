# A cada push a main: proves, imatge a GHCR i nou tag a deploy/kustomization.yaml.
# ArgoCD (albert-cluster) vigila deploy/ a main i desplega el canvi tot sol.
name: Build and deploy

on:
  push:
    branches: [main]
    # El commit del tag només toca aquest fitxer: no ha de tornar a disparar el workflow.
    paths-ignore:
      - deploy/kustomization.yaml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/persualia/vh-mecenatge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Lint and test
        run: |
          pnpm lint
          pnpm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point deploy/ at the new image
        run: |
          sed -i -E "s|^(    newTag: ).*|\1${GITHUB_SHA}|" deploy/kustomization.yaml
          git diff --exit-code deploy/kustomization.yaml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7} [skip ci]"
          # Si mentrestant algú ha fet push, el tag es torna a aplicar a sobre.
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
