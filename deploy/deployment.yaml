apiVersion: apps/v1
kind: Deployment
metadata:
  name: vh-mecenatge
  labels:
    app.kubernetes.io/name: vh-mecenatge
spec:
  # Una sola rèplica: el clúster és d'un node i les correccions ja viuen a S3.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vh-mecenatge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vh-mecenatge
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      # PSS "restricted": el namespace rebutja qualsevol pod que no compleixi això.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/persualia/vh-mecenatge
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: vh-mecenatge-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            # Amb el sistema de fitxers en només lectura, Next necessita on escriure la memòria cau.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
